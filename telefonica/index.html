<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Predicación telefónica — Ziv</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#c0392b">
  <style>
    :root { --bg: #f4f5f7; --tx: #444; --link: #c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121417; --tx: #aaa; --link: #ff6b60; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    body { font-family: system-ui, sans-serif; color: var(--tx); }
    /* La app de Apps Script ocupa toda la pantalla; el cargador queda detrás hasta que llega */
    #tel-frame {
      position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh;
      border: 0; display: block;
    }
    #tel-cargando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      text-align: center; padding: 24px; font-size: 16px;
    }
    #tel-cargando a { color: var(--link); font-weight: 700; display: none; }
    #tel-cargando.lento a { display: inline; }
  </style>
</head>
<body>

  <div id="tel-cargando">
    <div>Cargando Predicación Telefónica…</div>
    <a id="tel-directo" target="_top" rel="noopener">¿Tarda mucho? Abrir directamente</a>
  </div>

  <iframe
    id="tel-frame"
    title="Predicación Telefónica"
    allow="clipboard-write"></iframe>

  <script>
    // URL del despliegue de Apps Script (Implementar → Gestionar implementaciones → Aplicación web).
    // Si se vuelve a implementar como "Nueva implementación" la URL cambia: actualizarla acá.
    // Con "Nueva versión" de la misma implementación la URL se mantiene.
    const TEL_URL = 'https://script.google.com/macros/s/AKfycbx4PHfxMASH9vxzaoZc_jhTzQeD0-JKerAVPeuvc8dAA43Vc7x7b2VbOCoUehPyTOo/exec';

    const cargando = document.getElementById('tel-cargando');
    const frame    = document.getElementById('tel-frame');
    document.getElementById('tel-directo').href = TEL_URL;

    frame.addEventListener('load', () => { cargando.style.display = 'none'; });
    // Apps Script puede tardar unos segundos en arrancar en frío: ofrece la salida directa si se demora
    setTimeout(() => cargando.classList.add('lento'), 8000);

    frame.src = TEL_URL;
  </script>
</body>
</html>
