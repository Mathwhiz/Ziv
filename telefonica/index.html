<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Predicación telefónica — Ziv</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#c0392b">
  <style>
    :root { --bg: #f4f5f7; --tx: #444; --link: #c0392b; --bar-h: 44px; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121417; --tx: #aaa; --link: #ff6b60; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    body { font-family: system-ui, sans-serif; color: var(--tx); }
    /* Barra fina para volver al menú: en la app instalada (sobre todo iPhone) no hay botón atrás */
    #tel-barra {
      position: fixed; top: 0; left: 0; right: 0; z-index: 2;
      height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 12px 0;
      box-sizing: border-box; display: flex; align-items: center;
      /* Siempre clara, como la app de Apps Script (no sigue el modo oscuro del sistema) */
      background: #f4f5f7; border-bottom: 1px solid #e2e4e8;
    }
    #tel-volver {
      color: #333; text-decoration: none; font-size: 15px; font-weight: 600;
      padding: 8px 10px; border-radius: 10px;
    }
    #tel-volver:hover, #tel-volver:focus-visible { background: #e2e4e8; }
    /* La app de Apps Script ocupa el resto de la pantalla; el cargador queda detrás hasta que llega */
    #tel-frame {
      position: fixed; left: 0; right: 0; bottom: 0;
      top: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
      width: 100%; height: calc(100dvh - var(--bar-h) - env(safe-area-inset-top, 0px));
      border: 0; display: block;
    }
    #tel-cargando {
      position: fixed; inset: var(--bar-h) 0 0 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      text-align: center; padding: 24px; font-size: 16px;
    }
    #tel-cargando a { color: var(--link); font-weight: 700; display: none; }
    #tel-cargando.lento a { display: inline; }
  </style>
</head>
<body>

  <nav id="tel-barra">
    <a id="tel-volver" href="/#menu">← Ziv</a>
  </nav>

  <div id="tel-cargando">
    <div>Cargando Predicación Telefónica…</div>
    <a id="tel-directo" target="_top" rel="noopener">¿Tarda mucho? Abrir directamente</a>
  </div>

  <iframe
    id="tel-frame"
    title="Predicación Telefónica"
    allow="clipboard-write"></iframe>

  <script>
    // URL del despliegue de Apps Script (Implementar → Gestionar implementaciones → Aplicación web).
    // Si se vuelve a implementar como "Nueva implementación" la URL cambia: actualizarla acá.
    // Con "Nueva versión" de la misma implementación la URL se mantiene.
    const TEL_URL = 'https://script.google.com/macros/s/AKfycbx4PHfxMASH9vxzaoZc_jhTzQeD0-JKerAVPeuvc8dAA43Vc7x7b2VbOCoUehPyTOo/exec';

    const cargando = document.getElementById('tel-cargando');
    const frame    = document.getElementById('tel-frame');
    document.getElementById('tel-directo').href = TEL_URL;

    frame.addEventListener('load', () => { cargando.style.display = 'none'; });
    // Apps Script puede tardar unos segundos en arrancar en frío: ofrece la salida directa si se demora
    setTimeout(() => cargando.classList.add('lento'), 8000);

    frame.src = TEL_URL;
  </script>
</body>
</html>
